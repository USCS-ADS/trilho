name: Backend CI

on:
  push:
    branches: [main]
    paths: ["backend/API/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/API/**", ".github/workflows/backend-ci.yml"]

defaults:
  run:
    working-directory: backend/API

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Trilho.sln

      - name: Build
        run: dotnet build Trilho.sln --no-restore -c Release

      - name: Test
        run: dotnet test Trilho.sln --no-build -c Release --logger "trx;LogFileName=results.trx"

      - name: Vulnerable packages
        run: |
          dotnet list Trilho.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -qE "^\s+>" vulnerable.txt; then echo "Pacotes vulneráveis encontrados"; exit 1; fi

  docker-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem (sem publicar)
        run: docker build -t trilho-api:ci backend/API
