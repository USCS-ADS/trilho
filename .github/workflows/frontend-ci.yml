name: Frontend CI

on:
  push:
    branches: [main]
    paths: ["frontend/trilho-frontend/**", ".github/workflows/frontend-ci.yml"]
  pull_request:
    paths: ["frontend/trilho-frontend/**", ".github/workflows/frontend-ci.yml"]

defaults:
  run:
    working-directory: frontend/trilho-frontend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/trilho-frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: E2E (Playwright, modo demonstração)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Build
        run: npm run build

      - name: Relatório do Playwright (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/trilho-frontend/playwright-report

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
